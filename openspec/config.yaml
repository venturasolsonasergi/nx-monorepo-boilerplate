schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  This is an Nx monorepo with NestJS services under libs/<service>, a host API in apps/api,
  and a React browser client in apps/web. Write planning prose in English; retain OpenSpec's
  structural headings and normative SHALL/MUST keywords in English.
  OpenSpec requirements describe observable behavior. Each service's
  libs/<service>/specs/openapi.yaml remains its authoritative HTTP contract; keep both
  aligned, but do not duplicate an entire OpenAPI document as prose in OpenSpec.
  Organize persistent capabilities under openspec/specs/<namespace>/<capability>/spec.md.
  A namespace is either a microservice (discovered via libs/<service>/microservice.json) or
  the browser client `web` (the Nx application apps/web tagged platform:browser). `web` is a
  product surface, not a microservice: it has no microservice.json and no OpenAPI contract,
  and it stays out of service discovery, Prisma, contract-test, and OpenAPI validation flows.
  Express web capabilities as browser-observable behavior and reference backend public
  contracts (HTTP endpoints) rather than another namespace's internal domain or spec.
  A change may affect one or more namespaces; name every affected namespace and capability
  explicitly. Keep requirements portable with the namespace: do not make a namespace's
  capability depend on another namespace's internal domain or spec. Shared behavior must
  be stated as an external contract.
  Respect the dependency direction infrastructure -> application -> domain. Domain
  code must remain free of NestJS, Prisma, and Zod; application code must not import
  Prisma. Controllers stay thin and repository ports belong in application.
  Treat existing behavior as observed only when supported by implementation, tests, or
  current OpenAPI. Record gaps as open decisions; do not infer requirements from empty
  specs or placeholder tests.
  Do not commit, tag, or push as part of apply or archive.

rules:
  proposal:
    - Name every affected namespace and capability using the path <namespace>/<capability>; a namespace is a microservice or the browser client `web`.
    - State why the change is needed, what externally observable behavior changes, compatibility impact, and explicit non-goals.
    - Reuse existing capability paths; do not create near-duplicate specs for one behavior.
    - For web changes, scope requirements to browser-observable behavior and reference backend public contracts instead of restating their HTTP schemas.
  specs:
    - Write normative, testable behavior with at least one WHEN/THEN scenario per requirement.
    - Cover success, validation, error, persistence, and compatibility cases where they apply; do not require irrelevant categories.
    - For flows crossing browser, email, or external-provider boundaries, describe the observable entry point, return path, destination, session or state continuity, and failure outcome where applicable.
    - For web capabilities, describe the route, the visible state before and after a user action, and the resulting observable UI or redirect outcome; reference backend endpoints as external contracts.
    - Keep implementation details such as NestJS classes, React internals, and Prisma query design out of behavioral requirements.
    - Keep each namespace capability self-contained for extraction; cross-namespace behavior must reference a public contract, never another namespace's domain internals.
  design:
    - Explain affected namespace boundaries, layer placement, persistence/migration impact, risks, and rollback when applicable.
    - For external SDK or redirect integrations, verify the chosen version's actual URLs, cookies or state handling, and callback behavior before committing to an adapter design.
    - Keep API contract changes in the affected libs/<service>/specs/openapi.yaml and align response/error shapes with the delta spec; the `web` namespace has no OpenAPI contract.
    - For web-only changes, record that no backend contract is modified and keep browser end-to-end coverage free of database, email, and live API dependencies where possible.
  tasks:
    - Use tracked checkboxes in dependency order; every task states its namespace scope and a concrete verification command or observable result.
    - Include the relevant unit/contract tests and OpenAPI validation in the tasks that introduce backend behavior.
    - For web changes, include `pnpm web:test`, `pnpm web:build`, and `pnpm web:e2e` in the tasks that introduce browser behavior.
    - For flows crossing an external boundary, require a host-level test that follows the return path and preserves required cookies or state; initiating the flow or mocking its callback alone does not complete the task.
    - Include repo-wide architecture/dependency checks for changes that can affect shared boundaries; do not replace those with service-only tests.

operations:
  apply:
    guidance:
      - Read the full change artifacts and inspect the named namespace(s) before implementing.
      - For NestJS API changes, follow .agents/skills/nestjs-sdd-api-practices/SKILL.md.
      - For web changes, follow the apps/web conventions and run the web test, build, and browser e2e commands named in the tasks.
      - Implement one task at a time and mark it complete only after its stated verification succeeds.
      - When a task covers a browser, email, or external-provider flow, run its end-to-end return-path test before marking it complete; record unverified external dependencies explicitly.
      - Stop and update the change artifacts if implementation reveals a material requirement or design mismatch.
  archive:
    guidance:
      - Archive only after all tasks are complete and the checks for the affected namespace(s) passed. Affected backend services need their contract and OpenAPI validation, the `web` namespace needs `pnpm web:test`, `pnpm web:build`, and `pnpm web:e2e`, and required repo-wide checks always pass.
      - Review the proposed merge into openspec/specs/<namespace>/<capability>/spec.md before confirming archive.
      - Do not create a Git commit, tag, or push; report the archived change and a suggested commit summary.

