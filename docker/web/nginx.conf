# Serves the built client (apps/web) with SPA history fallback: direct
# navigation to any client route returns the client shell so its router can
# render the view, while asset paths are always served as their actual files.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets are immutable: cache them for as long as possible.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else resolves to the client shell (never cached, so deploys
  # are picked up immediately).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
