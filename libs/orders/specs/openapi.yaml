openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.1.0
paths:
  /orders/health:
    get:
      operationId: ordersHealth
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]