openapi: 3.0.3
info:
  title: Orders Service API
  version: 0.1.0
paths:
  /orders/health:
    get:
      operationId: ordersHealth
      responses:
        '200':
          description: Service health status
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  headers:
    RequestId:
      description: Identifier used to correlate the request and its response.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]