openapi: 3.0.3
info:
  title: Auth Service API
  version: 0.1.0
  x-spec-id: auth-identity
  description: >
    Identity and browser-session contract for registering, verifying,
    authenticating, and recovering accounts. The service owns identity,
    credentials, and sessions only; it never owns business profile data.
    Access to protected endpoints is carried by an HTTP-only session cookie
    set on login or OAuth callback, not by a bearer token in the response body.
paths:
  /auth/signup:
    post:
      operationId: authSignup
      summary: Register a pending email verification
      description: >
        Accepts only an email and creates a pending registration without an
        identity, credential, session, or profile. The registration expires 48
        hours after initiation; repeating signup while it is pending reuses it
        without extending the deadline. Returns the mail outcome for this
        attempt. No session cookie is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: >
            Pending registration returned with the fixed deadline and the
            transport outcome of this attempt
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
        '400':
          description: Invalid signup data
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Email already belongs to a verified identity
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '429':
          description: >
            Source blocked by the shared signup limit. No pending registration
            or per-address limit state is created.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
  /auth/verify-email:
    get:
      operationId: authVerifyEmailLink
      summary: Redirect an activation link to the web password-entry route
      description: >
        Redirects to the fixed configured web destination
        `/complete-signup?token=...`. It does not consume or verify the token
        and does not create a session, so opening the link (including by a mail
        scanner) cannot activate an account. No caller-selected redirect is
        accepted.
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the fixed password-entry destination
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
                format: uri
    post:
      operationId: authVerifyEmail
      deprecated: true
      summary: Retired password-free email verification
      description: >
        The former password-free activation endpoint. It always returns 410 and
        never verifies an identity, changes a credential, or issues a session.
        Activation is completed through `POST /auth/signup/complete`.
      responses:
        '410':
          description: Endpoint retired; no activation or session change
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoneError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/signup/complete:
    post:
      operationId: authCompleteSignup
      summary: Set the password and activate a pending registration
      description: >
        Accepts a registration token and the owner's password. With a valid,
        unexpired, single-use token it atomically creates the verified identity
        and credential, consumes the token, and issues the HTTP-only session
        cookie. No business profile is created. An invalid or expired token and
        an invalid password return 400 without changing state; a valid password
        is required before the token is consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteRequest'
      responses:
        '200':
          description: Identity and credential activated; session cookie set
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupCompleteResponse'
        '400':
          description: >
            Invalid password, or an invalid, expired, superseded, or already
            consumed token
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: >
            The email is already verified or linked to another identity, so the
            registration cannot be activated
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationConflictError'
        '429':
          description: >
            Rate limited while activating. When the identity and credential
            were already committed, accountActivated is true and the owner can
            log in with the established password.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '503':
          description: >
            Operational failure. When the identity and credential were already
            committed, accountActivated is true and the owner can log in with
            the established password.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /auth/verification/resend:
    post:
      operationId: authResendVerification
      summary: Resend a registration activation email
      description: >
        Returns a uniform request-acceptance response for pending, unknown,
        expired, and verified addresses, without disclosing account state or
        claiming transport acceptance or delivery. A new link is sent only for
        an unexpired pending registration within the shared limits; an allowed
        send rotates the single-use token so earlier links are superseded. The
        registration deadline is never extended and no registration is created
        for an unknown or expired address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: >
            Uniform request acceptance. retryAfterSeconds is present when the
            request was throttled.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
        '400':
          description: Invalid resend request
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/public-config:
    get:
      operationId: authPublicConfig
      summary: Read the public auth configuration
      description: >
        Returns only the configured public support email so clients can offer
        help when registration mail is not received. It never contains SMTP
        credentials, auth secrets, tokens, or private account data.
      responses:
        '200':
          description: Public auth configuration
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'
  /auth/login:
    post:
      operationId: authLogin
      summary: Log in with verified credentials
      description: >
        Issues a browser session only when the identity is email verified.
        Sets an HTTP-only session cookie and never returns the session token
        in the response body. Rate limits and operational failures are not
        reported as invalid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; session cookie set
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials or unverified identity
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Login rate limited
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '503':
          description: >
            Operational failure while checking credentials or issuing a
            session; not reported as invalid credentials
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the active session and clear its cookie
      responses:
        '200':
          description: Session revoked and cookie cleared
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Renew an active session
      description: >
        Renews an active verified session without requiring a browser-visible
        refresh token. Any replacement cookie is delivered in the response.
        Only an absent, invalid, revoked, expired, or unverified session yields
        401; rate limits and operational failures remain non-401.
      responses:
        '200':
          description: Session renewed
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Absent, invalid, revoked, expired, or unverified session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Session provider rate limited the refresh
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '503':
          description: >
            Operational failure while renewing the session; not interpreted as
            an absent session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /auth/account:
    get:
      operationId: authAccountSummary
      summary: Read the session identity's account summary
      description: >
        Returns the email of the identity resolved from the active valid
        verified session, whether a password credential exists for it, and
        when the current password was established or last changed. It uses
        only the session-derived identity and never returns another
        identity's data. No physical storage identifier is exposed.
      responses:
        '200':
          description: Account summary of the session identity
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          description: Absent, invalid, revoked, expired, or unverified session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Session provider rate limited the session check
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '503':
          description: >
            Operational failure while resolving the session; not interpreted
            as an absent session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /auth/password/change:
    post:
      operationId: authChangePassword
      summary: Change the session identity's password with the current one
      description: >
        Requires the current password and a new password satisfying the shared
        password policy (at least 12 and at most 128 characters, with at least
        one lowercase letter, one uppercase letter, one digit, and one special
        character). On a match the credential is replaced and every other
        active session of the identity is revoked, while the calling session is
        rotated with a replacement session cookie so the caller stays
        authenticated on the current device. A wrong current password returns
        400 identifying the current password field without changing the
        credential. A caller without a password credential is rejected with 400
        and no credential is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: >
            Password changed; every other session of the identity is revoked
            and the calling session is rotated with a replacement session cookie
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: >
            Validation failure (missing or unmet password policy, unrecognized
            fields), an incorrect current password, or no existing password
            credential; the credential is unchanged in every case
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Absent, invalid, revoked, expired, or unverified session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '429':
          description: Password change rate limited by the credential provider
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
        '503':
          description: >
            Operational failure while changing the credential or revoking the
            sessions; the change is not reported as successful
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /auth/reset-password/request:
    post:
      operationId: authRequestPasswordReset
      summary: Request a password reset without disclosing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Uniform non-disclosing response
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
        '400':
          description: Invalid request
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/reset-password/confirm:
    get:
      operationId: authResetPasswordLink
      summary: Redirect an emailed reset link to the web app
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: redirectTo
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to an approved web destination with the token
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
                format: uri
    post:
      operationId: authConfirmPasswordReset
      summary: Change a password with a single-use reset token
      description: >
        Consumes the reset token, changes the password, and revokes previously
        active sessions for the identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed and previous sessions revoked
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid, expired, or reused reset token
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/oauth/{provider}:
    post:
      operationId: authOauthStart
      summary: Start an OAuth flow for a configured provider
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '200':
          description: Authorization URL for the configured provider
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/OAuthStateCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '400':
          description: Unsupported or unconfigured provider
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '403':
          description: Request from an untrusted origin
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
  /auth/callback/{provider}:
    get:
      operationId: authOauthCallback
      summary: Complete an OAuth flow and redirect to an approved origin
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: better-auth.state
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to an approved web destination
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '400':
          description: Failed callback or untrusted redirect
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
components:
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
  headers:
    RequestId:
      description: Identifier used to correlate the request and its response.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
    SessionCookie:
      description: >
        HTTP-only authenticated session cookie. Secure is enabled on HTTPS and
        SameSite/path are set by deployment policy.
      schema:
        type: string
    ClearedSessionCookie:
      description: Expired session cookie that clears the browser session.
      schema:
        type: string
    OAuthStateCookie:
      description: >
        Short-lived, signed state cookie emitted when starting an OAuth flow.
        The browser must return it on the callback so the provider redirect is
        validated against the original request.
      schema:
        type: string
    RetryAfter:
      description: Number of seconds to wait before retrying the request.
      schema:
        type: integer
        minimum: 1
  schemas:
    SignupRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
    SignupResponse:
      type: object
      required:
        - status
        - expiresAt
        - emailStatus
      properties:
        status:
          type: string
          enum: [pending-verification]
        expiresAt:
          type: string
          format: date-time
          description: Fixed registration deadline, exactly 48 hours after initiation.
        emailStatus:
          type: string
          enum: [accepted, failed, throttled]
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Present when emailStatus is throttled.
    SignupCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: >
            Must satisfy the shared password policy: at least 12 and at most
            128 characters, with at least one lowercase letter, one uppercase
            letter, one digit, and one special (non-alphanumeric) character.
    SignupCompleteResponse:
      type: object
      required:
        - userId
        - status
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [authenticated]
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
    ResendVerificationResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [accepted]
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Present when the resend was throttled.
    PublicConfigResponse:
      type: object
      additionalProperties: false
      required:
        - supportEmail
      properties:
        supportEmail:
          type: string
          format: email
          nullable: true
          description: Public support contact; null outside production when unconfigured.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required:
        - userId
        - status
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [authenticated]
    RefreshResponse:
      type: object
      required:
        - userId
        - status
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [authenticated]
    AccountSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - email
        - hasPassword
        - passwordUpdatedAt
      properties:
        email:
          type: string
          format: email
        hasPassword:
          type: boolean
          description: Whether the identity has a password credential.
        passwordUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the current password was established or last changed; null
            when the identity has no password credential.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
    PasswordResetRequestResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: >
            Must satisfy the shared password policy: at least 12 and at most
            128 characters, with at least one lowercase letter, one uppercase
            letter, one digit, and one special (non-alphanumeric) character.
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: >
            Must satisfy the shared password policy: at least 12 and at most
            128 characters, with at least one lowercase letter, one uppercase
            letter, one digit, and one special (non-alphanumeric) character.
    OAuthStartResponse:
      type: object
      required:
        - provider
        - authorizationUrl
      properties:
        provider:
          type: string
        authorizationUrl:
          type: string
          format: uri
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    BadRequestError:
      type: object
      required:
        - statusCode
        - message
        - error
        - details
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: string
          enum: [Validation failed]
        error:
          type: string
          enum: [Bad Request]
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ValidationErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - required
            - invalid_type
            - too_small
            - invalid_format
            - unrecognized_keys
            - custom
        message:
          type: string
    UnauthorizedError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [401]
        message:
          type: string
          enum: [Invalid credentials]
        error:
          type: string
          enum: [Unauthorized]
    ForbiddenError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [403]
        message:
          type: string
          enum: [Untrusted origin]
        error:
          type: string
          enum: [Forbidden]
    ConflictError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [409]
        message:
          type: string
          enum: [Email already exists]
        error:
          type: string
          enum: [Conflict]
    RegistrationConflictError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [409]
        message:
          type: string
          enum: [Registration conflict]
        error:
          type: string
          enum: [Conflict]
    GoneError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [410]
        message:
          type: string
          enum: [Verification endpoint retired]
        error:
          type: string
          enum: [Gone]
    TooManyRequestsError:
      type: object
      required:
        - statusCode
        - message
        - error
        - retryAfterSeconds
      properties:
        statusCode:
          type: integer
          enum: [429]
        message:
          type: string
          enum: [Too Many Requests]
        error:
          type: string
          enum: [Too Many Requests]
        retryAfterSeconds:
          type: integer
          minimum: 1
        accountActivated:
          type: boolean
          description: >
            Present only for `POST /auth/signup/complete`. True when the
            identity and credential were committed before the rate limit.
    ServiceUnavailableError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [503]
        message:
          type: string
          enum: [Service Unavailable]
        error:
          type: string
          enum: [Service Unavailable]
        accountActivated:
          type: boolean
          description: >
            Present only for `POST /auth/signup/complete`. True when the
            identity and credential were committed before the failure.
