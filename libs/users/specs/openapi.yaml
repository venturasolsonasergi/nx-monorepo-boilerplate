openapi: 3.0.3
info:
  title: Users Service API
  version: 0.3.0
  x-spec-id: create-profile
  description: >
    Creates a business profile for the authenticated, email-verified identity.
    Identity fields (email) and the identity identifier are owned by the auth
    service; the profile is linked to the caller's server-derived authUserId
    and never to a caller-supplied identifier.
paths:
  /users/health:
    get:
      operationId: usersHealth
      security: []
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /users:
    post:
      operationId: createProfile
      summary: Create a profile for the authenticated identity
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Authenticated identity is not email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Profile already exists for this identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - surname
        - address
        - phone
      properties:
        name:
          type: string
          minLength: 1
        surname:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
    ProfileResponse:
      type: object
      required:
        - id
        - authUserId
        - name
        - surname
        - address
        - phone
      properties:
        id:
          type: integer
          format: int32
        authUserId:
          type: string
        name:
          type: string
        surname:
          type: string
        address:
          type: string
        phone:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    BadRequestError:
      type: object
      required:
        - statusCode
        - message
        - error
        - details
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: string
          enum: [Validation failed]
        error:
          type: string
          enum: [Bad Request]
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ValidationErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - required
            - invalid_type
            - too_small
            - invalid_format
            - unrecognized_keys
        message:
          type: string
    UnauthorizedError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [401]
        message:
          type: string
          enum: [Invalid session]
        error:
          type: string
          enum: [Unauthorized]
    ForbiddenError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [403]
        message:
          type: string
          enum: [Email not verified]
        error:
          type: string
          enum: [Forbidden]
    ConflictError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [409]
        message:
          type: string
          enum: [Profile already exists]
        error:
          type: string
          enum: [Conflict]
