openapi: 3.0.3
info:
  title: Users Service API
  version: 0.6.0
  x-spec-id: create-profile
  description: >
    Creates a business profile for the authenticated, email-verified identity.
    Identity fields (email) and the identity identifier are owned by the auth
    service; the profile is linked to the caller's server-derived authUserId
    and never to a caller-supplied identifier.
paths:
  /users/health:
    get:
      operationId: usersHealth
      security: []
      responses:
        '200':
          description: Service health status
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /users:
    post:
      operationId: createProfile
      summary: Create a profile for the authenticated identity
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: Invalid request
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Missing or invalid session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Authenticated identity is not email verified
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '409':
          description: Profile already exists for this identity
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  /users/me:
    get:
      operationId: getCurrentProfile
      summary: Retrieve the authenticated caller's own profile
      description: >
        Returns the profile linked to the caller's session-derived identity.
        The identity is resolved exclusively from the session cookie; no
        caller-supplied identifier is accepted. Email verification is not
        required for this read.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's profile
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing or invalid session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The authenticated identity has no profile
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    patch:
      operationId: updateCurrentProfile
      summary: Update the authenticated caller's own profile
      description: >
        Replaces the name, surname, address, and phone of the profile linked to
        the caller's session-derived identity with the submitted values, using
        the same field validation as profile creation (trimmed, non-empty
        fields, no unrecognized or identity-bearing properties). The identity
        is resolved exclusively from the session cookie; no caller-supplied
        identifier is accepted and email verification is not required for this
        update. A rejected request leaves the profile unchanged, and a caller
        whose identity owns no profile receives 404 without a profile being
        created.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '200':
          description: The updated caller's profile
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          description: >
            Invalid request: a missing or empty required field, an identity
            field (email or authUserId), or an unrecognized property
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Missing or invalid session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: >
            The authenticated identity has no profile; nothing is created
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /users/me/settings:
    get:
      operationId: getUserSettings
      summary: Retrieve the authenticated caller's own settings
      description: >
        Returns the settings linked to the caller's session-derived identity.
        The identity is resolved exclusively from the session cookie; no
        caller-supplied identifier is accepted. Email verification is not
        required for this read.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's settings
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '401':
          description: Missing or invalid session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: The authenticated identity has no stored settings
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsNotFoundError'
    patch:
      operationId: updateUserSettings
      summary: Create or partially update the authenticated caller's settings
      description: >
        Applies only the fields present in the request to the settings linked to
        the caller's session-derived identity, creating them when none exist.
        When the request omits theme while creating settings, the created
        settings have theme set to system. A theme outside the supported set is
        rejected with 400 and nothing is persisted. The identity is resolved
        exclusively from the session cookie; no caller-supplied identifier is
        accepted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserSettingsRequest'
      responses:
        '200':
          description: The resulting settings
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsResponse'
        '400':
          description: Invalid request
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: Missing or invalid session
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
components:
  headers:
    RequestId:
      description: Identifier used to correlate the request and its response.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - surname
        - address
        - phone
      properties:
        name:
          type: string
          minLength: 1
        surname:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
    ProfileResponse:
      type: object
      required:
        - id
        - authUserId
        - name
        - surname
        - address
        - phone
      properties:
        id:
          type: integer
          format: int32
        authUserId:
          type: string
        name:
          type: string
        surname:
          type: string
        address:
          type: string
        phone:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    BadRequestError:
      type: object
      required:
        - statusCode
        - message
        - error
        - details
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: string
          enum: [Validation failed]
        error:
          type: string
          enum: [Bad Request]
        details:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
    ValidationErrorDetail:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
          enum:
            - required
            - invalid_type
            - too_small
            - invalid_format
            - unrecognized_keys
        message:
          type: string
    UnauthorizedError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [401]
        message:
          type: string
          enum: [Invalid session]
        error:
          type: string
          enum: [Unauthorized]
    ForbiddenError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [403]
        message:
          type: string
          enum: [Email not verified]
        error:
          type: string
          enum: [Forbidden]
    ConflictError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [409]
        message:
          type: string
          enum: [Profile already exists]
        error:
          type: string
          enum: [Conflict]
    NotFoundError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [404]
        message:
          type: string
          enum: [Profile not found]
        error:
          type: string
          enum: [Not Found]
    SettingsNotFoundError:
      type: object
      required:
        - statusCode
        - message
        - error
      properties:
        statusCode:
          type: integer
          enum: [404]
        message:
          type: string
          enum: [Settings not found]
        error:
          type: string
          enum: [Not Found]
    UserSettingsResponse:
      type: object
      required:
        - language
        - theme
      properties:
        language:
          type: string
          enum: [es, en, ca]
        theme:
          type: string
          enum: [light, dark, system]
    UpdateUserSettingsRequest:
      type: object
      additionalProperties: false
      required:
        - language
      properties:
        language:
          type: string
          enum: [es, en, ca]
        theme:
          type: string
          enum: [light, dark, system]
